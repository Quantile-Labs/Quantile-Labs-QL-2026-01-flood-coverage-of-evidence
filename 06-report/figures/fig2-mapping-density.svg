<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' role="img" aria-label="Most of the mapping-density gradient was settled before any value was read. Population in reach of no evidenced forecast point, split by what fixed it">
<style>
  .s  { fill: #fcfcfb }
  .t1 { fill: #0b0b0b } .t2 { fill: #52514e } .tm { fill: #898781 }
  .grid  { stroke: #e1e0d9; stroke-width: 1 }
  .axis  { stroke: #c3c2b7; stroke-width: 1 }
  .c1 { fill: #2a78d6 } .c2 { fill: #eb6834 } .cg { fill: #898781 }
  .gap { stroke: #fcfcfb; stroke-width: 2 }
  @media (prefers-color-scheme: dark) {
    .s  { fill: #1a1a19 }
    .t1 { fill: #ffffff } .t2 { fill: #c3c2b7 }
    .grid { stroke: #2c2c2a } .axis { stroke: #383835 }
    .c1 { fill: #3987e5 } .c2 { fill: #d95926 }
    .gap { stroke: #1a1a19 }
  }
</style>
<rect width="760" height="280" class="s"/>
<text x="0" y="18" class="t1" font-size="15" font-weight="600">Most of the mapping-density gradient was settled before any value was read</text>
<text x="0" y="38" class="t2" font-size="12.5">Population in reach of no evidenced forecast point, split by what fixed it</text>
<rect x="200" y="56" width="11" height="11" class="c1"/>
<text x="217" y="66" class="t2" font-size="12">Fixed by whether a gauge was evaluated</text>
<rect x="490" y="56" width="11" height="11" class="c2"/>
<text x="507" y="66" class="t2" font-size="12">Decided by the published values</text>
<text x="188" y="104" class="t1" font-size="12.5" text-anchor="end" font-weight="600">Sparsest third</text>
<text x="188" y="119" class="tm" font-size="11" text-anchor="end">915,349 in reach</text>
<rect x="200.0" y="88.0" width="417.1" height="34" class="c1"/>
<rect x="619.1" y="88.0" width="0.9" height="34" class="c2"/>
<text x="208" y="110" font-size="12" fill="#ffffff" font-weight="600">99.3%</text>
<text x="627.9911142396127" y="110" class="t1" font-size="12.5" font-weight="600">99.998%</text>
<text x="188" y="158" class="t1" font-size="12.5" text-anchor="end" font-weight="600">Middle third</text>
<text x="188" y="173" class="tm" font-size="11" text-anchor="end">5,192,492 in reach</text>
<rect x="200.0" y="142.0" width="401.2" height="34" class="c1"/>
<path class="c2" d="M603.2 142 H615.3 a4 4 0 0 1 4 4 V172 a4 4 0 0 1 -4 4 H603.2 Z"/>
<text x="208" y="164" font-size="12" fill="#ffffff" font-weight="600">95.5%</text>
<text x="627.3042114362282" y="164" class="t1" font-size="12.5" font-weight="600">99.8%</text>
<text x="188" y="212" class="t1" font-size="12.5" text-anchor="end" font-weight="600">Densest third</text>
<text x="188" y="227" class="tm" font-size="11" text-anchor="end">65,140,820 in reach</text>
<rect x="200.0" y="196.0" width="318.3" height="34" class="c1"/>
<path class="c2" d="M520.3 196 H581.3 a4 4 0 0 1 4 4 V226 a4 4 0 0 1 -4 4 H520.3 Z"/>
<text x="208" y="218" font-size="12" fill="#ffffff" font-weight="600">75.8%</text>
<text x="593.262945762913" y="218" class="t1" font-size="12.5" font-weight="600">91.7%</text>
<line x1="200" y1="82" x2="200" y2="236" class="axis"/>
<text x="0" y="276" class="tm" font-size="11">Blue is where no gauge holds a metric file at all, so only the orange remainder was decided by what the published metrics say.</text>
</svg>