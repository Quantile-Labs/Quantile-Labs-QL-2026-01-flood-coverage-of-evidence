<svg xmlns="http://www.w3.org/2000/svg" width="760" height="396" viewBox="0 0 760 396" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' role="img" aria-label="The headline is a range because of one choice nobody made deliberately. African population behind a forecast point carrying no published per-gauge metric">
<style>
  .s  { fill: #fcfcfb }
  .t1 { fill: #0b0b0b } .t2 { fill: #52514e } .tm { fill: #898781 }
  .grid  { stroke: #e1e0d9; stroke-width: 1 }
  .axis  { stroke: #c3c2b7; stroke-width: 1 }
  .c1 { fill: #2a78d6 } .c2 { fill: #eb6834 } .cg { fill: #898781 }
  .gap { stroke: #fcfcfb; stroke-width: 2 }
  @media (prefers-color-scheme: dark) {
    .s  { fill: #1a1a19 }
    .t1 { fill: #ffffff } .t2 { fill: #c3c2b7 }
    .grid { stroke: #2c2c2a } .axis { stroke: #383835 }
    .c1 { fill: #3987e5 } .c2 { fill: #d95926 }
    .gap { stroke: #1a1a19 }
  }
</style>
<rect width="760" height="396" class="s"/>
<text x="0" y="18" class="t1" font-size="15" font-weight="600">The headline is a range because of one choice nobody made deliberately</text>
<text x="0" y="38" class="t2" font-size="12.5">African population behind a forecast point carrying no published per-gauge metric</text>
<line x1="300.0" y1="60" x2="300.0" y2="100" class="grid"/>
<text x="300.0" y="113" class="tm" font-size="10.5" text-anchor="middle">0%</text>
<line x1="395.0" y1="60" x2="395.0" y2="100" class="grid"/>
<text x="395.0" y="113" class="tm" font-size="10.5" text-anchor="middle">25%</text>
<line x1="490.0" y1="60" x2="490.0" y2="100" class="grid"/>
<text x="490.0" y="113" class="tm" font-size="10.5" text-anchor="middle">50%</text>
<line x1="585.0" y1="60" x2="585.0" y2="100" class="grid"/>
<text x="585.0" y="113" class="tm" font-size="10.5" text-anchor="middle">75%</text>
<line x1="680.0" y1="60" x2="680.0" y2="100" class="grid"/>
<text x="680.0" y="113" class="tm" font-size="10.5" text-anchor="middle">100%</text>
<text x="288" y="84" class="t1" font-size="12.5" text-anchor="end" font-weight="600">Population behind no</text>
<text x="288" y="99" class="t1" font-size="12.5" text-anchor="end" font-weight="600">published metric</text>
<path class="c2" d="M608.6 66 H647.2 a4 4 0 0 1 4 4 V90 a4 4 0 0 1 -4 4 H608.6 Z"/>
<text x="600.6" y="85" class="t1" font-size="13" font-weight="600" text-anchor="end">81.2%</text>
<text x="659.2" y="85" class="t1" font-size="13" font-weight="600">92.4%</text>
<text x="0" y="162" class="t2" font-size="12">How far each choice moves that figure, in percentage points</text>
<text x="288" y="190" class="t1" font-size="12.5" text-anchor="end">Which evaluation period is read</text>
<text x="288" y="203" class="tm" font-size="10.5" text-anchor="end">1980 against 2014, never argued for</text>
<path class="c2" d="M300.0 178 H650.9 a4 4 0 0 1 4 4 V200 a4 4 0 0 1 -4 4 H300.0 Z"/>
<text x="662.9" y="196" class="t1" font-size="12.5" font-weight="600">11.2</text>
<text x="288" y="236" class="t1" font-size="12.5" text-anchor="end">How far downstream the footprint runs</text>
<text x="288" y="249" class="tm" font-size="10.5" text-anchor="end">zero to eight basins</text>
<path class="cg" d="M300.0 224 H364.0 a4 4 0 0 1 4 4 V246 a4 4 0 0 1 -4 4 H300.0 Z"/>
<text x="376.0" y="242" class="t1" font-size="12.5" font-weight="600">2.1</text>
<text x="288" y="282" class="t1" font-size="12.5" text-anchor="end">How strict the definition is</text>
<text x="288" y="295" class="tm" font-size="10.5" text-anchor="end">any value, two-year, five-year</text>
<path class="cg" d="M300.0 270 H347.6 a4 4 0 0 1 4 4 V292 a4 4 0 0 1 -4 4 H300.0 Z"/>
<text x="359.6" y="288" class="t1" font-size="12.5" font-weight="600">1.6</text>
<text x="288" y="328" class="t1" font-size="12.5" text-anchor="end">Which population surface</text>
<text x="288" y="341" class="tm" font-size="10.5" text-anchor="end">three surfaces</text>
<path class="cg" d="M300.0 316 H308.6 a4 4 0 0 1 4 4 V338 a4 4 0 0 1 -4 4 H300.0 Z"/>
<text x="320.6" y="334" class="t1" font-size="12.5" font-weight="600">0.4</text>
<line x1="300" y1="172" x2="300" y2="348" class="axis"/>
<text x="300" y="366" class="tm" font-size="11">Gate D forbids a single headline figure above 10 points. The top bar is 11.2.</text>
<text x="0" y="392" class="tm" font-size="11">The period lever was found by an external reviewer after the analysis ran. The other three were pre-registered and measured.</text>
</svg>